name: VM Manager CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmmanager-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python runtime
        run: python3 --version

      - name: Compile source
        run: python3 -m compileall -q vm_webapp tests

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
