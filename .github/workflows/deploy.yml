name: Deploy VM Manager

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmmanager-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Raspberry
    runs-on: [self-hosted, Linux, ARM64, loxberry, vmmanager]
    timeout-minutes: 15

    steps:
      - name: Checkout selected revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source
        run: |
          python3 -m compileall -q vm_webapp tests
          python3 -m unittest discover -s tests -v

      - name: Deploy selected revision
        run: sudo /usr/local/sbin/vmmanager-deploy "${GITHUB_SHA}"
