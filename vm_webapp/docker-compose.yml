services:
  vmmanager:
    build: .
    container_name: vmmanager-vps
    ports:
      - "192.168.178.204:8000:8000"
    env_file:
      - /etc/migrated-containers/vmmanager.env
    environment:
      HOME: /root
      VM_MANAGER_LOG_FILE: /data/current.log
    volumes:
      - /opt/migrated/vmmanager/azure:/root/.azure
      - /opt/migrated/vmmanager/data:/data
    restart: unless-stopped
